<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reef Ledger</title>
<meta name="description" content="An unofficial progress tracker and daily planner for Coral Island. Works offline and installs on your phone or computer.">
<meta name="theme-color" content="#F7F0DE">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="fonts/imfell-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/newsreader-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside class="rail" id="rail"></aside>
  <div class="main">
    <header class="top">
      <div class="brand"><svg class="logo" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="lc" d="M12 18V10M12 14.5 7 9.5M7 9.5 6 4.5M7 9.5 9.5 6M12 12.5 17 7.5M17 7.5 18 3.5M17 7.5 14.5 4.5"/><path class="lw" d="M2.5 21c2.2 0 2.2-1.6 4.75-1.6S9.5 21 12 21s2.4-1.6 4.75-1.6S19.3 21 21.5 21"/></svg>Reef Ledger</div>
      <button class="btn sm" id="install" data-act="install" hidden>Install app</button>
      <button class="datepill" id="datepill" data-act="date" aria-label="Edit game date"></button>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<button class="ctxbar" id="ctx" data-act="date" aria-label="Change date, time and weather"></button>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<noscript><p style="padding:24px;font-family:sans-serif">Reef Ledger needs JavaScript to run.</p></noscript>
<script src="data.js"></script>
<script src="people.js"></script>
<script src="tips.js"></script>
<script src="features.js"></script>
<script src="app.js"></script>
</body>
</html>
